# Render blueprint: the Fixpoint API (backend/) from its Dockerfile. Secrets are entered in the dashboard.
services:
  - type: web
    name: fixpoint-api
    runtime: docker
    plan: free
    region: singapore # next to Neon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      - key: CORS_ORIGINS # the Vercel production origin, e.g. https://fixpoint.vercel.app
        sync: false
